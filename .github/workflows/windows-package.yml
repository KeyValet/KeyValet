name: Windows package

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (defaults to the kv-cli package version)'
        required: false
        type: string
        default: ''

# Windows release packages are unsigned. Tagged builds are attached to the draft release.
permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - architecture: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Resolve package version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $version = [regex]::Match((Get-Content rust/crates/kv-cli/Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($env:REQUESTED_TAG -and $env:REQUESTED_TAG -cne "v$version") { throw "Release tag must match v$version." }
          "PACKAGE_TAG=v$version" >> $env:GITHUB_ENV
      - name: Build package
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -Tag $env:PACKAGE_TAG -Architecture '${{ matrix.architecture }}'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.PACKAGE_TAG }}-windows-${{ matrix.architecture }}
          path: |
            dist/keyvalet-${{ env.PACKAGE_TAG }}-windows-${{ matrix.architecture }}.zip
            dist/SHA256SUMS-windows-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 7
