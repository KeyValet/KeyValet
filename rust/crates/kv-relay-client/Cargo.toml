[package]
name = "kv-relay-client"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kv-ipc = { path = "../kv-ipc" }
kv-core = { path = "../kv-core", default-features = false, features = ["remote"] }
kv-platform = { path = "../kv-platform" }
base64 = "0.22"
futures-util = "0.3"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
tokio-tungstenite = { version = "=0.26.2", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = { version = "=0.9.7", default-features = false, features = ["parse", "serde"] }
zeroize = "=1.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[dev-dependencies]
kv-agent = { path = "../kv-agent" }
kv-helper = { path = "../kv-helper" }
kv-mcp = { path = "../kv-mcp", features = ["runtime-probe"] }
kv-core = { path = "../kv-core" }
kv-server = { path = "../kv-server" }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
