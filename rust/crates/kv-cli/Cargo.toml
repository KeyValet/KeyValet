[package]
name = "kv-cli"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "kv-cli"
path = "src/main.rs"

[dependencies]
kv-core = { path = "../kv-core" }
kv-hook = { path = "../kv-hook" }
kv-i18n = { path = "../kv-i18n" }
kv-ipc = { path = "../kv-ipc" }
kv-platform = { path = "../kv-platform" }
kv-proxy = { path = "../kv-proxy" }
kv-vault = { path = "../kv-vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword = "7"
qrcode = { version = "=0.14.1", default-features = false }
libc = "0.2"
zeroize = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "process", "sync"] }

[dev-dependencies]
tempfile = "3"
kv-helper = { path = "../kv-helper" }
kv-agent = { path = "../kv-agent" }
