[package]
name = "kv-helper"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "kv-helper"
path = "src/main.rs"

[dependencies]
kv-core = { path = "../kv-core" }
kv-i18n = { path = "../kv-i18n" }
kv-ipc = { path = "../kv-ipc" }
kv-platform = { path = "../kv-platform" }
kv-proxy = { path = "../kv-proxy" }
kv-vault = { path = "../kv-vault" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
zeroize = "=1.9.0"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
url = "2"
toml = { version = "=0.9.7", default-features = false, features = ["parse", "serde"] }
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "signal", "sync", "time", "net"] }

[dev-dependencies]
tempfile = "3"
kv-server = { path = "../kv-server" }
kv-relay-client = { path = "../kv-relay-client" }
rusqlite = { version = "=0.32.1", features = ["hooks"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Diagnostics_ToolHelp"] }
