[package]
name = "kv-mobile-core"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
kv-core = { path = "../kv-core", default-features = false, features = ["remote"] }
flutter_rust_bridge = "=2.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
hkdf = "=0.12.4"
sha2 = { version = "=0.10.9", features = ["oid"] }
zeroize = "=1.9.0"
rand_core = { version = "0.6", features = ["std"] }
libc = "=0.2.189"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "=0.26.2", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
url = "2"

[dev-dependencies]
tempfile = "3"
kv-server = { path = "../kv-server" }
kv-helper = { path = "../kv-helper" }
kv-relay-client = { path = "../kv-relay-client" }
