[package]
name = "kv-hook"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "kv-hook"
path = "src/main.rs"

[dependencies]
regex = "1"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
kv-platform = { path = "../kv-platform" }
tokio = { version = "1", features = ["rt", "net", "io-util", "time"] }

[dev-dependencies]
tempfile = "3"
