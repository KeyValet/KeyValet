[workspace]
resolver = "2"
members = [
  "crates/kv-i18n",
  "crates/kv-ipc",
  "crates/kv-vault",
  "crates/kv-platform",
  "crates/kv-core",
  "crates/kv-protocols",
  "crates/kv-proxy",
  "crates/kv-touchid",
  "crates/kv-agent",
  "crates/kv-helper",
  "crates/kv-mcp",
  "crates/kv-cli",
  "crates/kv-hook",
  "crates/kv-server",
  "crates/kv-relay-client",
  "crates/kv-mobile-core",
  "crates/kv-push",
]

[workspace.dependencies]
serde_jcs = "=0.2.0"
jsonschema = { version = "=0.17.1", default-features = false }
hpke = { version = "=0.12.0", default-features = false, features = ["alloc", "std", "p256"] }

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.89"

[profile.release]
# Hardening for a setuid-adjacent, root-launched binary: smaller surface, no unwind tables to leak layout info.
panic = "abort"
strip = true
