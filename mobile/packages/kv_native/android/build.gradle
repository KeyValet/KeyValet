group = 'dev.keyvalet.nativebridge'
version = '0.3.0'
buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.11.1'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20' }
}
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
android {
    namespace 'dev.keyvalet.nativebridge'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        minSdk 31
        // Library instrumentation APKs otherwise fall back to minSdk as their target.
        targetSdk 36
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'consumer-rules.pro'
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; abiFilters 'arm64-v8a' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets { main.jniLibs.srcDirs += ['../../../native/android'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    testOptions { unitTests.returnDefaultValues = true }
}
repositories { google(); mavenCentral() }
dependencies {
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.firebase:firebase-messaging:24.1.2'
    implementation 'com.google.android.play:integrity:1.4.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
